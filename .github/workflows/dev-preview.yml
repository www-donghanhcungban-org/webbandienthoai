name: dev-preview

# Workflow của dự án mới dùng starter web-api-ts. Cài pack vào repo đã có package.json sẽ bỏ qua file này.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Dựng bản dev và kiểm luồng ghi chú
        run: bash tests_e2e/preview.sh --output "$RUNNER_TEMP/preview-browser.json"
      - name: Lưu receipt và bằng chứng trình duyệt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-preview-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/preview-browser.json
            docs/ops/DEPLOYS.json
