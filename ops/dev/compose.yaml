services:
  db:
    image: postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_DB: xt_preview
      POSTGRES_PASSWORD: ${XT_PREVIEW_DB_PASSWORD:?missing dev database password}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "xt_preview"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    image: ${XT_PREVIEW_IMAGE:?missing local dev image}
    pull_policy: never
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4317:3000"
    environment:
      DATABASE_URL: postgres://postgres:${XT_PREVIEW_DB_PASSWORD}@db:5432/xt_preview
      XT_DEMO_OWNER_PASSWORD: ${XT_DEMO_OWNER_PASSWORD:?missing dev owner password}
      XT_DEMO_GUEST_PASSWORD: ${XT_DEMO_GUEST_PASSWORD:?missing dev guest password}
      # Tenant "owner" của seed dev là cửa hàng; "guest" chỉ để kiểm cô lập tenant.
      SHOP_TENANT_ID: a13d1fef-0580-4033-99b9-a43d0d213110
    command:
      - sh
      - -ec
      - node src/migrate.ts up && node ops/dev/seed.mjs && node scripts/seed-shop.ts && unset XT_DEMO_OWNER_PASSWORD XT_DEMO_GUEST_PASSWORD && exec node src/server.ts
volumes:
  db: {}
